file:
    /app:
        exists: true
port:
    tcp:8000:
        listening: true
        ip:
            - 0.0.0.0
user:
    mrilko:
        exists: true
command:
    pwd:
        exit-status: 0
        stdout:
            - \/app
        stderr: ""
        timeout: 1000
    python --version:
        exit-status: 0
        stdout:
            - Python 3.11.10
        stderr: ""
        timeout: 1000
    whoami:
        exit-status: 0
        stdout:
            - mrilko
        stderr: ""
        timeout: 1000
process:
    python:
        running: true
http:
    http://localhost:8000:
        status: 200
        timeout: 5000
